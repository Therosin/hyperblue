name: hyperblue
description: Bluefin DX developer tooling on a Hyprland-first desktop with the Ambxst shell, keeping Bluefin's Waydroid support intact.
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: 44

modules:
  # Ship the Hyperblue CLI, the per-first-boot setup steps, the Ambxst
  # installer and the system-wide Hyprland / SDDM / portal configuration.
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  - type: bling
    install:
      - dconf-update-service

  # Hyprland and Quickshell are not in Fedora. This module is the strict one:
  # everything listed here must resolve, or the image has no usable session.
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
    install:
      packages:
        # Session, compositor, portal and polkit agent
        - hyprland
        - quickshell
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - hyprpolkitagent
        # Login manager and the X11 bits SDDM needs for DisplayServer=x11
        - sddm
        - xorg-x11-server-Xorg
        - xorg-x11-server-Xwayland
        # Minimum usable desktop: terminal, files, audio, network, bluetooth
        - alacritty
        # Bluefin's container-oriented terminal; kept as the default terminal.
        - ptyxis
        - Thunar
        - gvfs
        - gvfs-mtp
        - pavucontrol
        - network-manager-applet
        - nm-connection-editor
        - blueman
        - gnome-keyring-pam
        - unzip
        # Binder support is built into the Fedora kernel Bluefin ships
        # (CONFIG_ANDROID_BINDERFS=y), so no kmod or kernel swap is needed.
        # Initialisation stays an explicit user action: `ujust setup-waydroid`.
        - waydroid
    remove:
      # SDDM replaces GDM. auto-remove is off on purpose so the Bluefin DX
      # package set stays installed instead of cascading out of gnome-shell.
      auto-remove: false
      packages:
        - gdm

  # Long tail for the Ambxst shell. skip-unavailable keeps an upstream package
  # rename from breaking the whole image; nothing here is session-critical.
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - matugen
        - fuzzel
        - tmux
        - jq
        - wtype
        - wl-clipboard
        - brightnessctl
        - ddcutil
        - upower
        # Power profiles come from tuned-ppd, which the base image already
        # installs; requesting power-profiles-daemon aborts the transaction
        # because both provide ppd-service.
        - wlsunset
        - playerctl
        - easyeffects
        - libnotify
        - zenity
        - adw-gtk3-theme
        - kf6-syntax-highlighting
        - kf6-breeze-icons
        - hicolor-icon-theme
        - qt6-qtbase
        - qt6-qtdeclarative
        - qt6-qtwayland
        - qt6-qtsvg
        - qt6-qttools
        - qt6-qtimageformats
        - qt6-qtmultimedia
        - qt6-qtshadertools
        - qt5-qtwayland
        - tesseract
        - tesseract-langpack-eng
        - tesseract-langpack-spa
        - tesseract-langpack-jpn
        - tesseract-langpack-chi_sim
        - tesseract-langpack-chi_tra
        - tesseract-langpack-kor
        - tesseract-langpack-lat
        - google-roboto-fonts
        - google-roboto-mono-fonts
        - google-noto-fonts-common
        - google-noto-sans-cjk-fonts
        - google-noto-emoji-fonts
        - dejavu-sans-fonts
        - liberation-sans-fonts
        - gstreamer1
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugin-libav

  # Ambxst ships an installer that refuses to run as root, and it would put the
  # shell in a user's home anyway. Ours installs the same release system-wide.
  - type: script
    snippets:
      - "chmod 0755 /usr/bin/hyperblue /usr/libexec/hyperblue/install-ambxst /usr/libexec/hyperblue/ambxst-session-start /usr/libexec/hyperblue/sddm-default-session"
      - "chmod 0755 /usr/libexec/hyperblue/setup.d/*"
      - "bash /usr/libexec/hyperblue/install-ambxst"

  - type: systemd
    system:
      enabled:
        - sddm-default-session.service
        - sddm.service
        - waydroid-workaround.service
    user:
      # Runs `hyperblue setup` once per user, after login and with network.
      enabled:
        - hyperblue-setup.service

  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: signing
