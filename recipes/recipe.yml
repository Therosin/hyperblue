name: hyperblue
description: Bluefin DX developer tooling on a Hyprland-first desktop with Noctalia, keeping Bluefin's Waydroid support intact.
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: 44

modules:
  # Ship the Hyperblue CLI, per-user setup steps and the system-wide
  # Hyprland / SDDM / portal configuration.
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  - type: bling
    install:
      - dconf-update-service

  # Hyprland and Noctalia come from the configured COPR. This module is strict:
  # everything listed here must resolve, or the image has no usable session.
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
    install:
      packages:
        # Session, compositor, portal and polkit agent
        - hyprland
        - noctalia-git
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - hyprpolkitagent
        # Login manager and the X11 bits SDDM needs for DisplayServer=x11
        - sddm
        - xorg-x11-server-Xorg
        - xorg-x11-server-Xwayland
        # Minimum usable desktop: terminal, files, audio, network, bluetooth
        - alacritty
        # Bluefin's container-oriented terminal; kept as the default terminal.
        - ptyxis
        - Thunar
        - gvfs
        - gvfs-mtp
        - pavucontrol
        - network-manager-applet
        - nm-connection-editor
        - blueman
        - gnome-keyring-pam
        # English (UK) locale data for the system language default.
        - glibc-langpack-en
        # Binder support is built into the Fedora kernel Bluefin ships
        # (CONFIG_ANDROID_BINDERFS=y), so no kmod or kernel swap is needed.
        # Initialisation stays an explicit user action: `ujust setup-waydroid`.
        - waydroid
    remove:
      # SDDM replaces GDM. auto-remove is off on purpose so the Bluefin DX
      # package set stays installed instead of cascading out of gnome-shell.
      auto-remove: false
      packages:
        - gdm

  # Tools used by the desktop keybinds and clipboard integration.
  - type: dnf
    install:
      packages:
        - playerctl
        - brightnessctl
        - wl-clipboard

  - type: script
    snippets:
      - "chmod 0755 /usr/bin/hyperblue /usr/libexec/hyperblue/sddm-default-session"
      - "chmod 0755 /usr/libexec/hyperblue/setup.d/*"

  - type: systemd
    system:
      enabled:
        - sddm-default-session.service
        - sddm.service
        - waydroid-workaround.service
    user:
      # Runs pending per-user setup steps after login.
      enabled:
        - hyperblue-setup.service

  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: signing

