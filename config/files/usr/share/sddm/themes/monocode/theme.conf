[General]
# Hyperblue defaults for the Mono Code SDDM theme.
#
# Base palette is the upstream "panther" (dark) scheme; accentColor is the
# upstream panther blue, which keeps the greeter in step with the image's
# cool-toned desktop. SDDM reads this file because metadata.desktop names it as
# ConfigFile; a user override would go in theme.conf.user next to it, which is
# not possible on the read-only /usr of an rpm-ostree image, so the accent is
# baked in here instead of being written by the upstream install.py.
#
# Upstream: https://github.com/Mono-Code-Scheme/sddm (MIT, tag 1.2.1)

# Colors
backgroundColor="#111111"
boxColor="#141414"
borderColor="#383838"
buttonColor="#1F1F1F"
textColor="#F2F2F2"
secondaryTextColor="#E5E5E5"
accentColor="#72BBFF"
onAccentColor="#000000"
dangerColor="#FF7272"

# Wallpaper. A dark, accent-tinted gradient generated for Hyperblue; it is
# deliberately free of bright highlights, since it sits behind the login panel.
background="./assets/wallpaper.jpg"

# Icons
eyePath="./assets/eye.png"
eyeSlashPath="./assets/eye-slash.png"
restartPath="./assets/restart.png"
shutdownPath="./assets/shutdown.png"
chevronDownPath="./assets/chevron-down.png"
