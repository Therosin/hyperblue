# Hyperblue - system-wide Hyprland defaults.
#
# This file applies to a user that has no ~/.config/hypr/hyprland.conf yet, i.e.
# the very first login. `hyperblue setup`, which runs for every user on first
# login, then integrates the Ambxst shell (https://axeni.de/ambxst/), which
# writes the user's own config for all subsequent sessions.

$mainMod = SUPER

# Ambxst settings, generated per user by `ambxst install hyprland`.
# Missing on the very first login; Hyprland ignores a missing source file.
source = ~/.local/share/ambxst/hyprland.conf

# Ambxst provides the bar, launcher, notifications and desktop widgets. On the
# first login this also integrates Ambxst into the user's config.
exec-once = /usr/libexec/hyperblue/ambxst-session-start

# Graphical authentication agent for polkit prompts (sudo, package tools).
exec-once = systemctl --user start hyprpolkitagent.service

# Screen sharing / screenshots portal backend.
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service

misc {
    disable_hyprland_logo = true
}

# Fallback keybinds. Ambxst rebinds these in its own config where it differs;
# they keep the first session usable if the shell is not running yet.
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, E, exec, Thunar
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioPlay, exec, playerctl play-pause
bindel = , XF86AudioNext, exec, playerctl next
bindel = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-
